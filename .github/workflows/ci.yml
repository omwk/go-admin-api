name: CI
on:
  # Branch pushes are covered by pull_request; running both bills the same
  # commit twice. Doc-only changes do not need the test suite at all.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Race detection and capacity checks run nightly: they are deep checks, not
  # something every commit needs, and they are the most expensive jobs.
  schedule:
    - cron: '0 18 * * *'
# Superseded runs are cancelled: repeated pushes to the same PR must not queue
# up full test suites that are already obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-groups:
    name: Integration test coverage guard
    runs-on: [self-hosted, linux, x64]
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check integration test groups
        id: groups
        shell: pwsh
        run: ./scripts/check-test-groups.ps1

  static:
    name: static (vet, lint, build)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go vet ./...
      # Install via the module proxy instead of the action's GitHub release
      # download: the release CDN intermittently returns 504 and fails the job
      # for reasons unrelated to the code.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run
      - name: Unit tests (no race)
        run: go test -timeout 10m ./internal/kernel/... ./internal/modules/... ./internal/testenv ./internal/worker/...
      - name: Bootstrap and CLI tests without integration
        run: go test ./internal/bootstrap ./cmd/cli -skip Integration -count=1 -p 1
      - run: make build
      - name: Build and check runtime image
        run: |
          docker build -t commercehub:ci .
          size=$(docker image inspect commercehub:ci --format '{{.Size}}')
          echo "runtime image size: $size bytes"
          # Bloat guard, not an SLA. Baseline after M7 is 53 MB (29 MB binary +
          # 8 MB alpine); the ceiling leaves room for M8/M9 without hiding a
          # sudden regression such as accidentally shipping build tooling.
          test "$size" -lt 65000000

  nightly:
    name: nightly (race, capacity)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The job context is not available in job-level env; the port is resolved
      # per step below. This value is only a placeholder for steps that do not
      # touch the database.
      TEST_DATABASE_URL: postgres://commercehub@host.docker.internal:5432/commercehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - name: Unit tests (race)
        env:
          TEST_DATABASE_URL: postgres://commercehub@host.docker.internal:${{ job.services.postgres.ports[5432] }}/commercehub_test?sslmode=disable
        run: go test -race -timeout 15m ./internal/kernel/... ./internal/modules/... ./internal/testenv
      - name: Worker tests (race, including POSIX SIGTERM)
        env:
          TEST_DATABASE_URL: postgres://commercehub@host.docker.internal:${{ job.services.postgres.ports[5432] }}/commercehub_test?sslmode=disable
        run: go test -race -timeout 15m ./internal/worker/...
      - name: Capacity checks at full size
        env:
          TEST_DATABASE_URL: postgres://commercehub@host.docker.internal:${{ job.services.postgres.ports[5432] }}/commercehub_test?sslmode=disable
          REPLAY_CAPACITY_FULL: '1'
          EXPORT_CAPACITY_FULL: '1'
          SHARE_TIMING_STRICT: '1'
        run: go test ./internal/bootstrap -run 'Capacity|Timing' -count=1 -p 1

  integration:
    name: integration (${{ matrix.group }})
    needs: test-groups
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-groups.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        # Random host port: several shards run in parallel on the same host, so
        # a fixed mapping would collide. The actual port comes from the
        # job.services context in the step below.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      # Each shard has its own PostgreSQL service. Fixture scheduling bounds
      # concurrent pools and keeps capacity/deadline scenarios exclusive.
      - name: Integration tests (${{ matrix.group }})
        env:
          TEST_DATABASE_URL: postgres://commercehub@host.docker.internal:${{ job.services.postgres.ports[5432] }}/commercehub_test?sslmode=disable
        run: ${{ matrix.commands }}
