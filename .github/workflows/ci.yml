name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commercehub@localhost:5432/commercehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      # 单测与并发敏感的 kernel/modules 包开 race。
      - name: Unit tests (race)
        run: go test -race -timeout 15m ./internal/kernel/... ./internal/modules/...
      # 集成测试跑真实 PostgreSQL。不开 race：race 会把 bcrypt(12) 与迁移拖慢约十倍，
      # 击穿 kernel/cache 每次 1s 的 Redis 超时，造成 context deadline exceeded 的假红。
      # 并发用例的保障来自真实行锁/advisory lock 断言，不是 race 检测器。
      - name: Integration tests
        run: go test -timeout 25m -p 1 ./internal/bootstrap/... ./cmd/cli/...
      - run: make build
      - name: Build and check runtime image
        run: |
          docker build -t commercehub:ci .
          size=$(docker image inspect commercehub:ci --format '{{.Size}}')
          test "$size" -lt 50000000
