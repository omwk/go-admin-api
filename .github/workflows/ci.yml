name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-groups:
    name: Integration test coverage guard
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check integration test groups
        id: groups
        shell: pwsh
        run: ./scripts/check-test-groups.ps1

  unit:
    name: unit (race)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commercehub@localhost:5432/commercehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - name: Unit tests (race)
        run: go test -race -timeout 15m ./internal/kernel/... ./internal/modules/... ./internal/testenv
      - name: Worker tests (race, including POSIX SIGTERM)
        run: go test -race -timeout 15m ./internal/worker/...
      - name: Bootstrap and CLI tests without integration
        run: go test ./internal/bootstrap ./cmd/cli -skip Integration -count=1 -p 1
      - run: make build
      - name: Build and check runtime image
        run: |
          docker build -t commercehub:ci .
          size=$(docker image inspect commercehub:ci --format '{{.Size}}')
          test "$size" -lt 50000000

  integration:
    name: integration (${{ matrix.group }})
    needs: test-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-groups.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commercehub@localhost:5432/commercehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      # Each shard has its own PostgreSQL service. Fixture scheduling bounds
      # concurrent pools and keeps capacity/deadline scenarios exclusive.
      - name: Integration tests (${{ matrix.group }})
        run: ${{ matrix.commands }}
