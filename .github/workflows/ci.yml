name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commercehub
          POSTGRES_DB: commercehub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercehub -d commercehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commercehub@localhost:5432/commercehub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - run: go test -race -timeout 20m ./...
      - run: make build
      - name: Build and check runtime image
        run: |
          docker build -t commercehub:ci .
          size=$(docker image inspect commercehub:ci --format '{{.Size}}')
          test "$size" -lt 50000000
