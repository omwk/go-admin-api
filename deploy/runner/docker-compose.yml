# Self-hosted runner stack.
#
# Usage:
#   cp .env.example .env      # fill RUNNER_TOKEN or ACCESS_TOKEN
#   docker compose up -d --build
#
# ACCESS_TOKEN (a GitHub PAT with repo admin) is preferred: the container mints
# short-lived registration tokens itself, so it survives restarts after the
# one-hour registration token expires.
services:
  runner:
    build: .
    image: commercehub-runner:latest
    container_name: commercehub-runner
    restart: unless-stopped
    # The host proxy is reachable from containers only through this alias.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/omwk/go-admin-api}
      RUNNER_SCOPE: repo
      RUNNER_NAME: ${RUNNER_NAME:-commercehub-docker}
      LABELS: self-hosted,linux,x64,commercehub
      RUNNER_WORKDIR: /tmp/runner/work
      RUNNER_GROUP: default
      # Registration
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      # Keep one runner per container; scale with `docker compose up -d --scale`.
      EPHEMERAL: ${EPHEMERAL:-false}
      DISABLE_AUTO_UPDATE: 'true'
      STARTUP_DELAY: 2
      # Host mixed proxy: speeds up Go modules, tool installs and image pulls.
      # NO_PROXY must keep service containers and loopback direct, otherwise the
      # integration shards would reach postgres through the proxy.
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:10808}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:10808}
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,postgres,redis,.local
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,postgres,redis,.local
    volumes:
      # Needed by the static job: `docker build -t commercehub:ci .`
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner/work
    # The runner is the only thing that should ever call GitHub on our behalf.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  runner-work:
