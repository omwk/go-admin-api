# Self-hosted runner stack.
#
# Usage:
#   cp .env.example .env      # fill RUNNER_TOKEN or ACCESS_TOKEN
#   docker compose up -d --build
#
# ACCESS_TOKEN (a GitHub PAT with repo admin) is preferred: the container mints
# short-lived registration tokens itself, so it survives restarts after the
# one-hour registration token expires.
services:
  runner:
    build: .
    image: commercehub-runner:latest
    container_name: commercehub-runner
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/omwk/go-admin-api}
      RUNNER_SCOPE: repo
      RUNNER_NAME: ${RUNNER_NAME:-commercehub-docker}
      LABELS: self-hosted,linux,x64,commercehub
      RUNNER_WORKDIR: /tmp/runner/work
      RUNNER_GROUP: default
      # Registration
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      # Keep one runner per container; scale with `docker compose up -d --scale`.
      EPHEMERAL: ${EPHEMERAL:-false}
      DISABLE_AUTO_UPDATE: 'true'
      STARTUP_DELAY: 2
    volumes:
      # Needed by the static job: `docker build -t commercehub:ci .`
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner/work
    # The runner is the only thing that should ever call GitHub on our behalf.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  runner-work:
