openapi: 3.0.3
info:
  title: Tenant file library
  version: BE-IDN-024
security: [{bearerAuth: []}]
paths:
  /api/v1/admin/files:
    post:
      operationId: uploadFile
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: >-
        Up to 20 MiB (20971520 bytes). Allows JPEG, PNG, WebP, GIF, BMP, TIFF, ICO,
        SVG, PDF, CSV, XLSX, ZIP, text/plain, text/markdown, application/json,
        application/x-ndjson, text/xml, application/xml, application/yaml and text/yaml.
        Content sniffing and the extension whitelist decide acceptance; declared text
        aliases may match sniffed text/plain, but never override HTML or binary detection.
        File metadata records the sniffed type. HTML and JavaScript MIME types are rejected.
        No configured provider returns 409. Storage selection is persisted with the file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, maxLength: 20971520}
                purpose: {type: string, enum: [attachment, export, shop, snapshot], default: attachment}
      responses:
        '201':
          description: Authorized file response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileEnvelope'}
        '400': {$ref: '#/components/responses/UploadError'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '500': {$ref: '#/components/responses/Error'}
    get:
      operationId: listFiles
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      parameters:
        - {name: purpose, in: query, schema: {type: string, enum: [attachment, export, shop, snapshot]}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 256}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Authorized file response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilePageEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/admin/files/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: downloadFile
      description: Streams the original bytes with attachment disposition and nosniff.
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authorized file response
          headers:
            Content-Disposition: {schema: {type: string}, description: 'Always attachment, with the original filename.'}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteFile
      description: 'Deletes tenant metadata and atomically queues durable object cleanup; the worker retries storage failures using the recorded provider and bucket.'
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204':
          description: Authorized file response
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/admin/files/{id}/metadata:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getFileMetadata
      description: Returns safe same-tenant metadata without opening object storage. Deleted or missing uploaders use the name '#id'.
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Safe file metadata
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/admin/files/{id}/url:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: signFileURL
      description: 'Returns a five-minute SDK-signed URL including response-content-disposition=attachment, so SVG is downloaded rather than rendered.'
      x-permission: system:file:manage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authorized file response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/URLEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
  responses:
    UploadError:
      description: '10001: unsupported type, empty filename, or invalid file parameters. Type errors include the sniffed MIME and allowed whitelist.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unsupportedType:
              value:
                code: 10001
                message: '不支持的文件类型：text/html'
                trace_id: example-trace
                details:
                  mime: text/html
                  allowed: [application/json, application/pdf, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/x-ndjson, application/xml, application/yaml, application/zip, image/bmp, image/gif, image/jpeg, image/png, image/svg+xml, image/tiff, image/webp, image/x-icon, text/csv, text/markdown, text/plain, text/xml, text/yaml]
            emptyFilename:
              value: {code: 10001, message: 文件名不能为空, trace_id: example-trace}
    FileTooLarge:
      description: '10001: file exceeds the unchanged 20 MiB limit.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: 10001, message: 文件超过 20 MB 上限, trace_id: example-trace}
    Error:
      description: Parameter, authorization, isolation, storage, size or reference error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        details:
          type: object
          properties:
            mime: {type: string, description: Sniffed MIME for a type error}
            allowed: {type: array, items: {type: string}, description: Actual supported MIME whitelist}
    File:
      type: object
      additionalProperties: false
      required: [id, original_name, mime, size_bytes, sha256, purpose, uploaded_by, uploaded_by_name, created_at]
      properties:
        id: {type: integer, format: int64}
        original_name: {type: string}
        mime: {type: string}
        size_bytes: {type: integer, minimum: 1, maximum: 20971520}
        sha256: {type: string, minLength: 64, maxLength: 64}
        purpose: {type: string, enum: [product_image, attachment, export, shop, snapshot]}
        uploaded_by: {type: integer, format: int64, nullable: true, description: Null for files without an uploader}
        uploaded_by_name: {type: string, description: 'sys_user.username; deleted or missing users fall back to #id; empty when uploaded_by is null'}
        created_at: {type: string, format: date-time}
    FileEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        data: {$ref: '#/components/schemas/File'}
    FilePageEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        data:
          type: object
          additionalProperties: false
          required: [list, total, page, page_size]
          properties:
            list: {type: array, items: {$ref: '#/components/schemas/File'}}
            total: {type: integer}
            page: {type: integer}
            page_size: {type: integer}
    URLEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        data:
          type: object
          additionalProperties: false
          required: [url, expires_in]
          properties:
            url: {type: string}
            expires_in: {type: integer, enum: [300]}

