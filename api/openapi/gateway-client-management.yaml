paths:
  /api/v1/admin/api-clients/{id}:
    get:
      operationId: getGatewayClient
      x-permission: gateway:client:list
      description: Returns owned client metadata without secret material.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Client metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientInfoEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateGatewayClient
      x-permission: gateway:client:update
      description: Updates supplied client metadata fields using the required optimistic-lock version. Omitted fields remain unchanged. An empty ip_whitelist clears the whitelist. Entries accept IP addresses or CIDR prefixes and are stored canonically. The app_id and client secrets are unchanged.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientUpdateInput'}
      responses:
        '200':
          description: Updated client metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientInfoEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/api-clients/{id}/routes:
    get:
      operationId: listGatewayClientRouteGrants
      x-permission: gateway:client:list
      description: "Lists all owned grants ordered by route_code ascending. A deleted route uses #route_id as route_code."
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Route grants, including route metadata and quota limits
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteGrantListEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/api-clients/{id}/routes/{grant_id}:
    delete:
      operationId: revokeGatewayClientRouteGrant
      x-permission: gateway:client:grant
      description: Revokes one owned route grant and records gateway.route.revoke.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - in: path
          name: grant_id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '204': {description: Grant revoked}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Sanitized management error
      content:
        application/json:
          schema:
            type: object
            required: [code, message, trace_id]
            properties:
              code: {type: integer}
              message: {type: string}
              trace_id: {type: string}
              details: {type: object, additionalProperties: true}
  schemas:
    ClientInfoEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        data: {$ref: '#/components/schemas/ClientInfo'}
    ClientInfo:
      type: object
      additionalProperties: false
      required: [id, app_id, name, owner_user_id, status, version, ip_whitelist]
      properties:
        id: {type: integer, format: int64}
        app_id: {type: string}
        name: {type: string}
        owner_user_id: {type: integer, format: int64}
        status: {type: string, enum: [active, suspended]}
        version: {type: integer}
        ip_whitelist: {type: array, description: Canonical IP addresses or CIDR prefixes. An empty array disables the whitelist., items: {type: string}}
    ClientUpdateInput:
      type: object
      additionalProperties: false
      required: [version]
      description: Omit name, ip_whitelist, or status to leave that field unchanged. Supply an empty ip_whitelist array to clear it. At least one mutable field is required.
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        ip_whitelist:
          type: array
          maxItems: 100
          description: IP addresses or CIDR prefixes. 0.0.0.0/0 and ::/0 are rejected.
          items: {type: string}
        status: {type: string, enum: [active, suspended]}
        version: {type: integer, minimum: 1}
    RouteGrantListEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/RouteGrantInfo'}}
    RouteGrantInfo:
      type: object
      additionalProperties: false
      required: [id, route_id, route_code, route_name, method, path, status, quota_daily, quota_monthly, granted_at, expires_at, version]
      properties:
        id: {type: integer, format: int64}
        route_id: {type: integer, format: int64}
        route_code: {type: string}
        route_name: {type: string}
        method: {type: string, enum: [GET, HEAD]}
        path: {type: string}
        status: {type: string, enum: [active, suspended]}
        quota_daily: {type: integer, format: int64}
        quota_monthly: {type: integer, format: int64}
        granted_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        version: {type: integer}
