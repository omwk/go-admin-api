openapi: 3.0.3
info:
  title: M1a Authentication API
  version: 0.M1a
  description: Default-tenant authentication and current-user navigation. No M1b management APIs.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate by username and password
      description: Ten requests per minute per IP. Five username failures lock the account for 15 minutes. Each login creates a new session family.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Newly issued credentials and safe user summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '423': {$ref: '#/components/responses/AccountLocked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate one refresh token in its session family
      description: The first rotation succeeds once. Reuse within 30 seconds of that rotation returns 20109 without reissuing or extending grace. Later replay revokes the family. DB commits before Redis writes; Redis failure returns 503 with DB state preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: A new access token and refresh token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefreshResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '409': {$ref: '#/components/responses/RefreshInFlight'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the authenticated session family
      description: All refresh history is persistently revoked before Redis markers are written. Other session families are unaffected. No rotation grace applies.
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked; empty response body}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Read the current user, roles and flat permission codes
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Same user and permissions projection as menus
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/menus:
    get:
      operationId: menus
      summary: Read user, navigation tree and flat permission codes together
      description: Active visible non-button menus only. Inaccessible parents suppress descendants. Siblings sort by sort then id; maximum depth is five. Super administrators receive all tenant permission codes and all eligible menus.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Aggregated current-user navigation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenusResponse'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    InvalidRequest:
      description: HTTP 400 / code 10001; invalid or missing request fields
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidCredentials:
      description: HTTP 401 / code 20101; username or password is incorrect
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TokenRejected:
      description: HTTP 401 / code 20102 for natural expiry or 20103 for invalid, absent or revoked credentials and sessions
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AccountLocked:
      description: HTTP 423 / code 20104; username is locked
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: HTTP 429 / code 10005; IP limit does not increment username failures
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RefreshInFlight:
      description: HTTP 409 / code 20109; wait for the successful concurrent refresh result; never retry the old token indefinitely
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: HTTP 503 / code 10002; a dependency failed; authentication fails closed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string, description: HS256 JWT with sub/tid/sid/jti/exp/iat; 15-minute lifetime}
        refresh_token: {type: string, description: 32 random bytes in URL-safe base64; 7-day lifetime}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64, enum: [900]}
    LoginData:
      allOf:
        - {$ref: '#/components/schemas/TokenPair'}
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/UserSummary'}
    UserSummary:
      type: object
      required: [id, username]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string}
    User:
      type: object
      required: [id, tenant_id, username, dept_id, is_super, roles]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string}
        avatar: {type: string}
        dept_id: {type: integer, format: int64}
        is_super: {type: boolean}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    Role:
      type: object
      required: [id, code, name]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
    Overview:
      type: object
      required: [user, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$'}
    MenusData:
      allOf:
        - {$ref: '#/components/schemas/Overview'}
        - type: object
          required: [menus]
          properties:
            menus:
              type: array
              items: {$ref: '#/components/schemas/Menu'}
    Menu:
      type: object
      required: [id, parent_id, name, type, sort, keep_alive, is_external, meta, children]
      properties:
        id: {type: integer, format: int64}
        parent_id: {type: integer, format: int64}
        name: {type: string}
        type: {type: string, enum: [dir, menu, link]}
        path: {type: string}
        component: {type: string}
        redirect: {type: string}
        icon: {type: string}
        sort: {type: integer}
        keep_alive: {type: boolean}
        is_external: {type: boolean}
        permission_code: {type: string}
        meta: {type: object, additionalProperties: true}
        children:
          type: array
          items: {$ref: '#/components/schemas/Menu'}
    SuccessEnvelope:
      type: object
      required: [code, message, trace_id, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string, enum: [ok]}
        trace_id: {type: string}
        request_id: {type: string}
    LoginResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LoginData'}
    RefreshResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TokenPair'}
    MeResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Overview'}
    MenusResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/MenusData'}
    ErrorResponse:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer, enum: [10001, 10002, 10005, 20101, 20102, 20103, 20104, 20109]}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        details: {type: object, additionalProperties: true}
