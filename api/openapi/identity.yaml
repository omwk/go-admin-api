openapi: 3.0.3
info:
  title: Identity Authentication and Management API
  version: 0.M5c
  description: Eight documented authentication and self-service endpoints and twenty-nine management operations. Read operations never take management locks. Authorization changes commit before bounded version invalidation; pending invalidation returns the successful status and X-Authz-Invalidation=pending.
paths:
  /api/v1/admin/depts:
    get:
      operationId: listDepartments
      x-permission: system:user:list
      security: [{bearerAuth: []}]
      description: Tenant-shared department directory ordered by sort then id. One batch query includes direct non-deleted member counts; zero members and empty children are represented as 0 and [].
      responses:
        '200': {$ref: '#/components/responses/DepartmentTree'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createDepartment
      x-permission: system:dept:create
      description: Create a tenant department under an existing parent. parent_id=0 returns 400/10001 with message "已存在根部门，请选择上级部门" before sibling-name checks. The parent must belong to this tenant (404 otherwise). The server computes path from the generated ID; client path fields are rejected. Sibling names are serialized and duplicates return 400/10001.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/Department'}
        '400': {$ref: '#/components/responses/DepartmentInvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/depts/{id}:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readDepartment
      x-permission: system:user:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Department'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: updateDepartment
      x-permission: system:dept:update
      description: Replace editable fields. Changing a non-root department to parent_id=0 returns 400/10001 with message "根部门不可移动" before sibling-name checks. The seeded root can be renamed/reordered with parent_id=0 and keeps path=1 without recalculation. Moving a department recalculates its entire subtree path in the same transaction. Self/descendant parents and sibling duplicates return 400/10001. Foreign or missing targets/parents and zero affected rows return 404. Path is server managed and cannot be submitted.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Department'}
        '400': {$ref: '#/components/responses/DepartmentInvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteDepartment
      x-permission: system:dept:delete
      description: Physically delete an empty department with a full audit snapshot. Roots return 400/10001. Children, users (including retained deleted rows), custom role scope links or other physical references return 409/10004. Disabled status does not prevent deletion. Missing or foreign targets return 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Department physically deleted; no body}
        '400': {$ref: '#/components/responses/DepartmentInvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      summary: Verify the current account password for PII disclosure
      description: Session-bound password check using login rate limits, lockout protection and persistent audit. Success stores reauth_at on this refresh family. Refresh preserves the timestamp; a new login starts without it. PII access requires age strictly below five minutes and a separate live permission.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        '200':
          description: Session reauthentication timestamp and five-minute expiry
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    required: [reauth_at, expires_at]
                    properties:
                      reauth_at: {type: string, format: date-time}
                      expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '423': {$ref: '#/components/responses/AccountLocked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate by tenant code, account and password
      description: Select the exact tenant code using tenant, then deprecated tenant_id, then tenant.default_code (default default). Legacy tenant_id is supported for one compatibility version and emits a WARN plus X-Tenant-Deprecated=1, including on errors; it is ignored when tenant is nonempty. Ten requests per minute per IP; 100 failed logins per minute per tenant code block further logins with 429. Failure counters use tenant code and normalized account; five account failures lock the user for 15 minutes, shared by username/email/phone aliases. Unknown tenants and incorrect passwords return the same 401/20101 message 企业代码、账号或密码错误. Suspended tenants return 403/20111 only after the password is verified. Each successful login creates a new session family.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Newly issued credentials and safe user summary
          headers:
            X-Tenant-Deprecated:
              description: Present only when legacy tenant_id selects the tenant; remove tenant_id and send tenant code.
              schema: {type: string, enum: ['1']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/TenantSuspended'}
        '423': {$ref: '#/components/responses/AccountLocked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate one refresh token in its session family
      description: The first rotation succeeds once. Reuse within 30 seconds of that rotation returns 20109 without reissuing or extending grace. Later replay revokes the family. DB commits before Redis writes; Redis failure returns 503 with DB state preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: A new access token and refresh token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefreshResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/TenantSuspended'}
        '409': {$ref: '#/components/responses/RefreshInFlight'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the authenticated session family
      description: All refresh history is persistently revoked before Redis markers are written. Other session families are unaffected. No rotation grace applies.
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked; empty response body}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/profile:
    put:
      operationId: updateOwnProfile
      summary: Update the authenticated user's profile
      description: Nickname defaults to an empty string when omitted. Optional email and avatar retain their existing update and normalization rules. Phone uses the same normalization as login (E.164, mainland local mobiles and formatting separators); omission or null preserves it, and an empty string clears it. Invalid phone returns 400/10001; a phone already used by another non-deleted user in the same tenant returns 409/10004 with message 该手机号已被使用. The profile change and system:user:profile phone audit commit atomically before cache invalidation. The response retains the safe management user shape; read the current phone through /auth/me.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/AdminUser'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PasswordChangeRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/sessions:
    get:
      operationId: listOwnSessions
      summary: List the authenticated user's active session families
      description: Only the current tenant and user are read. Persistent refresh history decides revocation and expiration; Redis retains revocation markers. Each family exposes the IP and User-Agent from its latest live refresh row (created_at DESC then id DESC). IP is a valid canonical address with at most 45 characters; User-Agent is truncated to 256 bytes without splitting UTF-8. Missing legacy metadata returns null. Current is true exactly when the row sid equals the requesting JWT sid, including after refresh. Responses contain no access/refresh tokens, token hashes, passwords or password hashes. Sorted by created_at DESC then sid DESC; timestamps are RFC3339 UTC.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {in: query, name: sort, schema: {type: string, enum: ['-created_at'], default: '-created_at'}}
      responses:
        '200':
          description: Paginated current-user session metadata
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/Page'}
                          - type: object
                            properties:
                              list: {type: array, items: {$ref: '#/components/schemas/OwnSession'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PasswordChangeRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Read the current user, roles and flat permission codes
      description: Returns only the authenticated user's own email, phone and department name with the shared identity projection. Unset or empty contacts are explicit nulls; a missing department name is null. Department data is joined with both tenant and department IDs in one identity query.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Same user and permissions projection as menus
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/menus:
    get:
      operationId: menus
      summary: Read user, navigation tree and flat permission codes together
      description: Active visible non-button menus only. Inaccessible parents suppress descendants. Siblings sort by sort then id; maximum depth is five. Super administrators receive all tenant permission codes and all eligible menus.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Aggregated current-user navigation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenusResponse'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/users:
    get:
      operationId: listUsers
      x-permission: system:user:list
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {in: query, name: sort, schema: {type: string, enum: [-created_at, created_at, username, -username], default: -created_at}}
        - {in: query, name: keyword, description: Case-insensitive substring match on username/nickname/email. Empty string disables this filter., allowEmptyValue: true, schema: {type: string, maxLength: 256}}
        - {in: query, name: status, description: Exact account status match. Empty string disables this filter., allowEmptyValue: true, schema: {type: string, enum: [active, disabled, locked]}}
      responses:
        '200': {$ref: '#/components/responses/UserPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createUser
      x-permission: system:user:create
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/AdminUser'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/users/{id}:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readUser
      x-permission: system:user:list
      description: Safe account detail including dept_id, status and UTC timestamps. Missing, deleted or out-of-scope users return 404.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminUser'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: updateUser
      x-permission: system:user:update
      description: Scalar fields only. Role IDs, credentials and is_super are rejected; role assignment uses /roles. Zero affected rows returns 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserFields'}}}}
      responses:
        '200': {$ref: '#/components/responses/AdminUser'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteUser
      x-permission: system:user:delete
      description: Soft delete; preserves historical references. Built-in admin cannot be deleted (409/10004). Missing, deleted or other-tenant target returns 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: User soft deleted; no body, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/users/{id}/reset-password:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      operationId: resetUserPassword
      x-permission: system:user:reset
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
      responses:
        '204': {description: Password updated; no body or credentials echoed, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/users/{id}/unlock:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      operationId: unlockUser
      x-permission: system:user:update
      security: [{bearerAuth: []}]
      description: Clear failed_attempts and locked_until and activate a locked account in one audited transaction. Already clear accounts return 200 without repeating audit. Disabled accounts return 409/10004. Missing, deleted, foreign or out-of-scope accounts return 404.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/AdminUser'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {description: Internal failure; unlock and audit roll back together, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/users/{id}/roles:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readUserRoles
      x-permission: system:user:list
      description: Assigned role IDs in ascending order. The owner must be visible in the current user scope; otherwise 404.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AssignedIDs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: grantUserRoles
      x-permission: system:user:grant
      description: Replace role_ids, including an empty array to revoke all. Both sides must belong to this tenant and lie within the operator's management authority.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRolesRequest'}}}}
      responses:
        '204': {description: Roles replaced; no body, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      x-permission: system:role:list
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {in: query, name: sort, description: Roles have no created_at; default order follows descending identity., schema: {type: string, enum: [-id, id, code, -code], default: -id}}
      responses:
        '200': {$ref: '#/components/responses/RolePage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createRole
      x-permission: system:role:create
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/AdminRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/roles/{id}:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readRole
      x-permission: system:role:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: updateRole
      x-permission: system:role:update
      description: Scalar role configuration only; custom department associations use /depts. Zero affected rows returns 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/AdminRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteRole
      x-permission: system:role:delete
      description: Physical deletion. Explicitly checks sys_user_role, sys_role_menu, sys_role_permission and sys_role_dept; any reference returns 409/20105. super_admin is protected (409/10004). Entire row is audited as before, after is JSON null, in the same transaction. Missing/other-tenant/zero affected rows returns 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Role physically deleted and snapshot audited; no body, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RoleDeleteConflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/roles/{id}/menus:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readRoleMenus
      x-permission: system:role:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AssignedIDs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: grantRoleMenus
      x-permission: system:role:grant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleMenusRequest'}}}}
      responses:
        '204': {description: Menu IDs replaced within operator authority; empty array revokes all, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/roles/{id}/permissions:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readRolePermissions
      x-permission: system:role:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AssignedIDs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: grantRolePermissions
      x-permission: system:role:grant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissionsRequest'}}}}
      responses:
        '204': {description: Permission IDs replaced within operator authority; empty array revokes all, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/roles/{id}/depts:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readRoleDepartments
      x-permission: system:role:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AssignedIDs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: grantRoleDepartments
      x-permission: system:role:grant
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleDepartmentsRequest'}}}}
      responses:
        '204': {description: Custom departments replaced within operator authority; empty array revokes all, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/menus:
    get:
      operationId: listMenus
      x-permission: system:menu:list
      description: Full tenant configuration tree, including hidden/disabled nodes and buttons.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminMenuTree'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createMenu
      x-permission: system:menu:create
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MenuRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/AdminMenu'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/menus/{id}:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    get:
      operationId: readMenu
      x-permission: system:menu:list
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminMenu'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: updateMenu
      x-permission: system:menu:update
      description: Tenant advisory lock precedes a full graph re-read including hidden/disabled nodes. Cycles return 400/20106; whole-subtree depth above five returns 400/10001. path remains a route path.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MenuRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/AdminMenu'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteMenu
      x-permission: system:menu:delete
      description: Physical deletion under the tenant tree lock. Children (including hidden/disabled nodes) return 409/10004 with details.children; sys_role_menu references return 409/10004 with details.roles. Entire row is audited as before, after is JSON null, in the same transaction. Missing/other-tenant/zero affected rows returns 404.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Menu physically deleted and snapshot audited; no body, headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/MenuDeleteConflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/permissions:
    get:
      operationId: listPermissions
      x-permission: system:menu:list
      description: Stored permission entries grouped by module; registry is the only permission dictionary.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/PermissionGroups'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/sessions:
    get:
      operationId: listSessions
      x-permission: system:session:list
      description: Only non-revoked sessions with an unexpired refresh are listed. No last_seen is inferred. Applies the same owner and department scopes as users; page and count use one filtered relation.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200':
          description: Page of active refresh families
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/Page'}
                          - type: object
                            properties:
                              list: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/admin/sessions/{sid}:
    parameters: [{in: path, name: sid, required: true, schema: {type: string, maxLength: 128}}]
    delete:
      operationId: kickSession
      x-permission: system:session:kick
      description: A known accessible sid, including expired history or a repeated kick, returns 204. Unknown, out-of-scope or foreign-tenant sid returns 404. Serializes with refresh using the same session lock. DB revocation commits before Redis; a Redis write failure returns 503 while DB revocation remains effective.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Persistent family revocation confirmed; empty body}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/TokenRejected'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  headers:
    AuthzInvalidation:
      description: Present as pending only when the business change committed but bounded authorization-version invalidation was not confirmed. The response remains successful; clients must not replay the committed mutation. Residual authorization payloads expire within five minutes.
      schema: {type: string, enum: [pending]}
  parameters:
    ResourceID: {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    PageSize: {in: query, name: page_size, description: Values over 100 are clamped to 100., schema: {type: integer, minimum: 1, default: 20}}
    IdempotencyKey: {in: header, name: Idempotency-Key, description: Optional 24-hour key scoped to the actor and operation. Same body replays the first status/data; a different body returns 409/10006., schema: {type: string, maxLength: 256}}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    PasswordChangeRequired:
      description: Live account password policy requires a password change (403/20102).
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    DepartmentInvalidRequest:
      description: HTTP 400 / code 10001 for invalid department fields, a client-supplied path, creating a root, moving a non-root to parent_id=0, a duplicate sibling name, a self/descendant parent, or deleting a root department.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    DepartmentTree:
      description: Department tree including empty children and zero direct members
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/DepartmentNode'}}}}]}}}
    Department:
      description: Tenant department detail and direct member count
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Department'}}}]}}}
    AssignedIDs:
      description: Assigned IDs in ascending order; no associations returns an empty array
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {type: array, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}}}]}}}
    NotFound:
      description: HTTP 404 / code 10003; target absent, deleted, outside tenant or zero affected rows
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PermissionDenied:
      description: HTTP 403 / code 20107 for missing operation permission or excessive grants; 20108 for missing identity/effective roles or data scope rejection
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    TenantSuspended:
      description: HTTP 403 / code 20111 租户已停用. Login reports this only after verifying the password. Refresh rejection does not consume or rotate the token.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: HTTP 409 / code 10004 for a duplicate/protected/referenced resource, or 10006 for an idempotency body mismatch
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RoleDeleteConflict:
      description: HTTP 409. Code 20105 if ANY of sys_user_role/sys_role_menu/sys_role_permission/sys_role_dept references the role; details.references reports counts. Code 10004 protects super_admin. Code 10006 indicates idempotency mismatch.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ErrorResponse'}
              - type: object
                properties:
                  code: {type: integer, enum: [20105, 10004, 10006]}
          examples:
            referenced: {value: {code: 20105, message: 角色仍被引用, trace_id: example, details: {references: {users: 0, menus: 1, permissions: 0, depts: 0}}}}
            protected: {value: {code: 10004, message: 资源仍被引用或受保护, trace_id: example}}
    MenuDeleteConflict:
      description: HTTP 409 / code 10004. details.children counts direct children (all statuses/visibility); otherwise details.roles counts sys_role_menu references. Code 10006 indicates idempotency mismatch.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ErrorResponse'}
              - type: object
                properties:
                  code: {type: integer, enum: [10004, 10006]}
                  details:
                    type: object
                    properties:
                      children: {type: integer, minimum: 1}
                      roles: {type: integer, minimum: 1}
          examples:
            children: {value: {code: 10004, message: 菜单仍被引用, trace_id: example, details: {children: 2}}}
            roles: {value: {code: 10004, message: 菜单仍被引用, trace_id: example, details: {roles: 1}}}
    AdminUser:
      description: Complete safe user projection; no credential fields
      headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AdminUser'}}}]}}}
    AdminRole:
      description: Complete role configuration row
      headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AdminRole'}}}]}}}
    AdminMenu:
      description: Complete menu configuration row; route path semantics are preserved
      headers: {X-Authz-Invalidation: {$ref: '#/components/headers/AuthzInvalidation'}}
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AdminMenu'}}}]}}}
    AdminMenuTree:
      description: Full configuration tree
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminMenuNode'}}}}]}}}
    UserPage:
      description: Paginated users; default page=1 and page_size=20, maximum 100
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/Page'}, {type: object, properties: {list: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}}}]}}}]}}}
    RolePage:
      description: Paginated roles; default page=1 and page_size=20, maximum 100
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/Page'}, {type: object, properties: {list: {type: array, items: {$ref: '#/components/schemas/AdminRole'}}}}]}}}]}}}
    PermissionGroups:
      description: Module to permission entry array
      content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/SuccessEnvelope'}, {type: object, properties: {data: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/Permission'}}}}}]}}}
    InvalidRequest:
      description: HTTP 400 / code 10001 for invalid input or menu depth greater than five; 20106 for menu cycles
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidCredentials:
      description: HTTP 401 / code 20101. Login uses 企业代码、账号或密码错误 for unknown tenant codes, absent accounts and incorrect passwords.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TokenRejected:
      description: HTTP 401 / code 20102 for natural expiry or 20103 for invalid, absent or revoked credentials and sessions
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AccountLocked:
      description: HTTP 423 / code 20104; username is locked
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: HTTP 429 / code 10005. Login allows ten requests per minute per IP and blocks a tenant code after 100 failures in a one-minute window. Rejected requests do not increment account failure counters.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RefreshInFlight:
      description: HTTP 409 / code 20109; wait for the successful concurrent refresh result; never retry the old token indefinitely
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: HTTP 503 / code 10002; a dependency failed; authentication fails closed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    DepartmentRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        parent_id: {type: integer, format: int64, minimum: 0, default: 0, description: 0 仅用于种子根部门，API 不接受创建根部门或将普通部门移为根；种子根部门保留 0 可改名和排序。其他值必须指向当前租户的已有部门。}
        name: {type: string, minLength: 1, maxLength: 64}
        sort: {type: integer, format: int32, minimum: -2147483648, maximum: 2147483647, default: 0}
        status: {type: string, enum: [active, disabled]}
    Department:
      type: object
      required: [id, parent_id, name, path, sort, status, member_count]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        parent_id: {type: integer, format: int64, minimum: 0}
        name: {type: string}
        path: {type: string}
        sort: {type: integer}
        status: {type: string, enum: [active, disabled]}
        member_count: {type: integer, format: int64, minimum: 0}
    DepartmentNode:
      allOf:
        - {$ref: '#/components/schemas/Department'}
        - type: object
          required: [children]
          properties:
            children: {type: array, items: {$ref: '#/components/schemas/DepartmentNode'}}
    ProfileRequest:
      type: object
      properties:
        nickname: {type: string, maxLength: 256, default: ''}
        email: {type: string, maxLength: 256, nullable: true, description: Existing email normalization and clearing semantics are preserved.}
        phone: {type: string, maxLength: 32, nullable: true, description: Normalized to E.164 using the login phone rules. Omit or null to retain; an empty string clears it.}
        avatar: {type: string, maxLength: 2048, nullable: true}
    OwnSession:
      type: object
      required: [sid, user_id, created_at, expires_at, ip, user_agent, current]
      additionalProperties: false
      properties:
        sid: {type: string}
        user_id: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ip: {type: string, maxLength: 45, nullable: true}
        user_agent: {type: string, maxLength: 256, nullable: true, description: At most 256 bytes of valid UTF-8; null when absent.}
        current: {type: boolean, description: Whether sid equals the authenticated JWT sid.}
    Session:
      type: object
      required: [sid, user_id, created_at, expires_at]
      additionalProperties: false
      properties:
        sid: {type: string}
        user_id: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    UserFields:
      type: object
      additionalProperties: false
      required: [dept_id, status]
      properties:
        nickname: {type: string, maxLength: 256, nullable: true}
        email: {type: string, format: email, maxLength: 256, nullable: true}
        avatar: {type: string, maxLength: 2048, nullable: true}
        dept_id: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [active, disabled, locked]}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, dept_id, status]
      properties:
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true}
        nickname: {type: string, maxLength: 256, nullable: true}
        email: {type: string, format: email, maxLength: 256, nullable: true}
        avatar: {type: string, maxLength: 2048, nullable: true}
        dept_id: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [active, disabled, locked]}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true}
    AdminUser:
      type: object
      required: [id, tenant_id, username, nickname, email, avatar, dept_id, status, is_super, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string, nullable: true}
        email: {type: string, nullable: true}
        avatar: {type: string, nullable: true}
        dept_id: {type: integer, format: int64}
        status: {type: string, enum: [active, disabled, locked]}
        is_super: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoleRequest:
      type: object
      additionalProperties: false
      required: [code, name, data_scope, status]
      properties:
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 256}
        data_scope: {type: string, enum: [all, dept, dept_and_child, self, custom]}
        remark: {type: string, nullable: true, maxLength: 2048}
        status: {type: string, enum: [active, disabled]}
    AdminRole:
      type: object
      required: [id, tenant_id, code, name, data_scope, remark, status]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        data_scope: {type: string, enum: [all, dept, dept_and_child, self, custom]}
        remark: {type: string, nullable: true}
        status: {type: string, enum: [active, disabled]}
    MenuRequest:
      type: object
      additionalProperties: false
      required: [name, type, status]
      properties:
        parent_id: {type: integer, format: int64, minimum: 0, default: 0}
        name: {type: string, minLength: 1, maxLength: 256}
        type: {type: string, enum: [dir, menu, button, link]}
        path: {type: string, nullable: true, maxLength: 2048}
        component: {type: string, nullable: true, maxLength: 2048}
        redirect: {type: string, nullable: true, maxLength: 2048}
        icon: {type: string, nullable: true, maxLength: 256}
        sort: {type: integer, default: 0}
        visible: {type: boolean, default: false}
        keep_alive: {type: boolean, default: false}
        is_external: {type: boolean, default: false}
        permission_code: {type: string, nullable: true, pattern: '^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$'}
        meta: {type: object, additionalProperties: true, default: {}}
        status: {type: string, enum: [active, disabled]}
    AdminMenu:
      type: object
      required: [id, tenant_id, parent_id, name, type, path, component, redirect, icon, sort, visible, keep_alive, is_external, permission_code, meta, status]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        parent_id: {type: integer, format: int64}
        name: {type: string}
        type: {type: string, enum: [dir, menu, button, link]}
        path: {type: string, nullable: true}
        component: {type: string, nullable: true}
        redirect: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        sort: {type: integer}
        visible: {type: boolean}
        keep_alive: {type: boolean}
        is_external: {type: boolean}
        permission_code: {type: string, nullable: true}
        meta: {type: object, additionalProperties: true}
        status: {type: string, enum: [active, disabled]}
    AdminMenuNode:
      allOf:
        - {$ref: '#/components/schemas/AdminMenu'}
        - type: object
          required: [children]
          properties:
            children: {type: array, items: {$ref: '#/components/schemas/AdminMenuNode'}}
    Permission:
      type: object
      required: [id, tenant_id, code, name, module, type]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        code: {type: string, pattern: '^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$'}
        name: {type: string}
        module: {type: string}
        type: {type: string, enum: [api, button, data]}
    Page:
      type: object
      required: [list, total, page, page_size]
      properties:
        total: {type: integer, format: int64}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    UserRolesRequest:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    RoleMenusRequest:
      type: object
      additionalProperties: false
      required: [menu_ids]
      properties:
        menu_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    RolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permission_ids]
      properties:
        permission_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    RoleDepartmentsRequest:
      type: object
      additionalProperties: false
      required: [dept_ids]
      properties:
        dept_ids: {type: array, maxItems: 500, uniqueItems: true, items: {type: integer, format: int64, minimum: 1}}
    LoginRequest:
      type: object
      required: [password]
      anyOf:
        - required: [username]
        - required: [account]
      properties:
        tenant: {type: string, maxLength: 64, description: Exact tenant code; takes precedence over tenant_id. Omitted or empty uses legacy tenant_id when positive, otherwise tenant.default_code (default default).}
        tenant_id: {type: integer, format: int64, minimum: 0, deprecated: true, description: Legacy tenant ID for one compatibility version. When used without tenant, emits a WARN and X-Tenant-Deprecated=1. Omitted or zero falls back to tenant.default_code; platform_id does not change this default.}
        account: {type: string, minLength: 1, maxLength: 256}
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string, description: HS256 JWT with sub/tid/sid/jti/exp/iat; 15-minute lifetime}
        refresh_token: {type: string, description: 32 random bytes in URL-safe base64; 7-day lifetime}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64, enum: [900]}
    LoginData:
      allOf:
        - {$ref: '#/components/schemas/TokenPair'}
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/UserSummary'}
    UserSummary:
      type: object
      required: [id, username]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string}
    User:
      type: object
      required: [id, tenant_id, tenant_code, username, email, phone, dept_id, dept_name, is_super, roles]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        tenant_code: {type: string, minLength: 1, maxLength: 64, description: Current user's immutable tenant code}
        username: {type: string}
        nickname: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true, description: Normalized E.164 phone; null when unset.}
        avatar: {type: string}
        dept_id: {type: integer, format: int64}
        dept_name: {type: string, nullable: true}
        is_super: {type: boolean}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    Role:
      type: object
      required: [id, code, name]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
    Overview:
      type: object
      required: [user, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$'}
    MenusData:
      allOf:
        - {$ref: '#/components/schemas/Overview'}
        - type: object
          required: [menus]
          properties:
            menus:
              type: array
              items: {$ref: '#/components/schemas/Menu'}
    Menu:
      type: object
      required: [id, parent_id, name, type, sort, keep_alive, is_external, meta, children]
      properties:
        id: {type: integer, format: int64}
        parent_id: {type: integer, format: int64}
        name: {type: string}
        type: {type: string, enum: [dir, menu, link]}
        path: {type: string}
        component: {type: string}
        redirect: {type: string}
        icon: {type: string}
        sort: {type: integer}
        keep_alive: {type: boolean}
        is_external: {type: boolean}
        permission_code: {type: string}
        meta: {type: object, additionalProperties: true}
        children:
          type: array
          items: {$ref: '#/components/schemas/Menu'}
    SuccessEnvelope:
      type: object
      required: [code, message, trace_id, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string, enum: [ok]}
        trace_id: {type: string}
        request_id: {type: string}
    LoginResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LoginData'}
    RefreshResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TokenPair'}
    MeResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Overview'}
    MenusResponse:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/MenusData'}
    ErrorResponse:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer, enum: [10001, 10002, 10003, 10004, 10005, 10006, 20101, 20102, 20103, 20104, 20105, 20106, 20107, 20108, 20109, 20111]}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        details: {type: object, additionalProperties: true}
