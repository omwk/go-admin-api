openapi: 3.0.3
info:
  title: Shop, Credential and File API
  version: 0.M2
  description: Shop and credential management operations. Permission values are copied from the runtime route manifests.
paths:
  /api/v1/admin/credentials/{cid}/versions:
    parameters: [{name: cid, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    get:
      operationId: listCredentialVersions
      x-permission: shop:credential:audit
      security: [{bearerAuth: []}]
      description: Retired versions only, descending by version_no then id; the current version is excluded. Returns [] before rotation. Rechecks the live parent shop scope, performs no decryption and exposes no ciphertext, nonce, AAD or raw metadata.
      responses:
        '200': {description: Safe retired version history, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialVersionsEnvelope'}}}}
        '400': {description: Invalid ID, content: {application/json: {schema: {$ref: './identity.yaml#/components/schemas/ErrorResponse'}}}}
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: './identity.yaml#/components/schemas/ErrorResponse'}}}}
        '403': {description: Missing route permission, content: {application/json: {schema: {$ref: './identity.yaml#/components/schemas/ErrorResponse'}}}}
        '404': {description: Missing credential or parent shop outside current scope, content: {application/json: {schema: {$ref: './identity.yaml#/components/schemas/ErrorResponse'}}}}
  /api/v1/admin/platforms:
    get:
      operationId: listPlatforms
      x-permission: ""
      security: [{bearerAuth: []}]
      responses: {200: {description: Platform list}}
  /api/v1/admin/shops:
    get:
      operationId: listShops
      x-permission: shop:store:list
      security: [{bearerAuth: []}]
      responses: {200: {description: Shop page}}
    post:
      operationId: createShop
      x-permission: shop:store:create
      security: [{bearerAuth: []}]
      responses: {201: {description: Created shop}}
  /api/v1/admin/shops/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    get:
      operationId: getShop
      x-permission: shop:store:read
      security: [{bearerAuth: []}]
      responses: {200: {description: Shop}}
    put:
      operationId: updateShop
      x-permission: shop:store:update
      security: [{bearerAuth: []}]
      responses: {200: {description: Updated shop}}
    delete:
      operationId: deleteShop
      x-permission: shop:store:delete
      security: [{bearerAuth: []}]
      responses: {204: {description: Deleted shop}}
  /api/v1/admin/shops/{id}/credentials:
    parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    get:
      operationId: listCredentials
      x-permission: shop:credential:list
      security: [{bearerAuth: []}]
      responses: {200: {description: Credential page}}
    post:
      operationId: createCredential
      x-permission: shop:credential:create
      security: [{bearerAuth: []}]
      responses: {201: {description: Created credential}}
  /api/v1/admin/credentials/{cid}:
    parameters: [{name: cid, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    put:
      operationId: rotateCredential
      x-permission: shop:credential:rotate
      security: [{bearerAuth: []}]
      responses: {200: {description: Rotated credential}}
  /api/v1/admin/credentials/{cid}/check:
    parameters: [{name: cid, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    post:
      operationId: checkCredential
      x-permission: shop:credential:check
      security: [{bearerAuth: []}]
      responses: {400: {description: Unsupported check}}
  /api/v1/admin/credentials/{cid}/disable:
    parameters: [{name: cid, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    post:
      operationId: disableCredential
      x-permission: shop:credential:disable
      security: [{bearerAuth: []}]
      responses: {204: {description: Disabled credential}}
  /api/v1/admin/credentials/{cid}/audits:
    parameters: [{name: cid, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    get:
      operationId: listCredentialAudits
      x-permission: shop:credential:audit
      security: [{bearerAuth: []}]
      responses: {200: {description: Audit page}}
  /api/v1/admin/files:
    post:
      operationId: uploadFile
      x-permission: ""
      security: [{bearerAuth: []}]
      responses: {201: {description: Uploaded file}}
  /api/v1/admin/files/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
    get:
      operationId: downloadFile
      x-permission: ""
      security: [{bearerAuth: []}]
      responses: {200: {description: File content}}
components:
  schemas:
    CredentialVersionsEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/CredentialVersion'}}
    CredentialVersion:
      type: object
      additionalProperties: false
      required: [id, version_no, fingerprint, issued_at, expires_at, created_reason, created_by, retired_at, purge_after]
      properties:
        id: {type: integer, format: int64}
        version_no: {type: integer, minimum: 1}
        fingerprint: {type: string}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        created_reason: {type: string}
        created_by: {type: integer, format: int64}
        retired_at: {type: string, format: date-time, nullable: true}
        purge_after: {type: string, format: date-time, nullable: true}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
