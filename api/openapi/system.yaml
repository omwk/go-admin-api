      "put": {
        "operationId": "updateSettingGroup",
        "description": "Body is a direct key/value object, e.g. {password_min_length: 8}. The registered group schema alone authorizes keys and types. Unknown, read_only, null, invalid type/range/enum/timezone values return 400/10001 with details.key. Numbers are integers; system_name length is 1-64 Unicode characters; timezone is IANA. The batch is atomic and audit contains keys/types/SHA256 digests only. password_*, login_* and default_page_size are read on subsequent requests; other values are saved/displayed only.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-permission": "system:setting:update",
        "parameters": [
          {
            "name": "group",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "security",
                "system",
                "notification"
              ]
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 256
            },
            "description": "Optional 24-hour actor/operation key. A matching body replays the original result without repeating writes/audit; a different body returns 409/10006."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
