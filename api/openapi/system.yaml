        "description": "Platform super administrator only (including the platform tenant). Issues a seven-day single-use administrator invitation and revokes pending invitations of the target tenant in the same transaction. No active super administrator: allowed; otherwise force=true is required. Suspended tenants return 409/10004. Acceptance activates or resets the existing super administrator; if none remains, the unbound invite creates a new first administrator. Audit action system:tenant:admin_invite includes actor_tenant, target_tenant and force; no credential is audited. Optional idempotency includes force and stores the response encrypted.",
        "operationId": "reissueTenantAdminInvite",
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "format": "int64",
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "name": "force",
            "in": "query",
            "required": false,
            "description": "Required to reset an existing active administrator.",
            "schema": {
              "type": "boolean",
              "default": false
            }
          },
          {
            "description": "Optional write replay key; mismatched body409. Provision responses are encrypted at rest and replay the original invitation.",
            "in": "header",
            "name": "Idempotency-Key",
            "required": false,
            "schema": {
              "maxLength": 256,
              "type": "string"
            }
          }
        ],
        "responses": {
          "201": {
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Envelope"
                    },
                    {
                      "properties": {
                        "data": {
                          "$ref": "#/components/schemas/TenantAdminInviteResult"
                        }
                      },
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "Successful operation",
            "headers": {
              "Cache-Control": {
                "description": "no-store",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Invalid request (10001)"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Invalid or expired credentials"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Missing permission (20107) or password change required"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Absent or foreign target (10003); non-platform global operations also return404"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Active administrator without force=true: 10004 该租户已有管理员; suspended tenant: 10004 租户已停用; idempotency mismatch: 10006."
          },
