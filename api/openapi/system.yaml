      "put": {
        "operationId": "updateSettingGroup",
        "description": "Body is a direct key/value object, e.g. {password_min_length: 8}. The registered group schema alone authorizes keys and types. Unknown, read_only, null, invalid type/range/enum/timezone values return 400/10001 with details.key. Numbers are integers; system_name length is 1-64 Unicode characters; timezone is IANA. The batch is atomic and audit contains keys/types/SHA256 digests only. password_*, login_*, default_page_size and tenant registration settings are read on subsequent requests; other values are saved/displayed only. The tenant group requires a super administrator or system:tenant:manage or system:setting:update, persists allow_self_registration/default_role_code/registration_hourly_limit in tenant.settings and preserves unrelated JSON keys. The sync group stores unknown_value_policy (reject/keep_raw/fallback_null, default keep_raw), drift_alert_threshold (integer 1-10000, default 1) and auto_promote_baseline (boolean, default false); these policies are saved/displayed only.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-permission": "system:setting:update",
        "parameters": [
          {
            "name": "group",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "security",
                "system",
                "notification",
                "sync",
                "tenant"
              ]
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 256
            },
            "description": "Optional 24-hour actor/operation key. A matching body replays the original result without repeating writes/audit; a different body returns 409/10006."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "minProperties": 1,
                "additionalProperties": true
              }
            }
          }
        },
