          {
            "bearerAuth": []
          }
        ],
        "x-permission": "system:dict:list",
        "parameters": [
          {
            "name": "scope",
            "in": "query",
            "allowEmptyValue": true,
            "description": "Omit or leave empty to return both system and business dictionaries.",
            "schema": {
              "type": "string",
              "enum": [
                "system",
                "business"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 10000,
              "default": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
