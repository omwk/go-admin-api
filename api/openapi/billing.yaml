openapi: 3.0.3
info:
  title: Billing benefits, statements and reconciliation
  version: 1.0.0
  description: |
    M9b/M9c. JWT and registered permissions protect every operation. Application data
    is restricted to the current owner. All writes require Idempotency-Key.
    Lists return at most 100 items. Monetary values are int64 CNY cents.
    One call uses one source: free entitlement, earliest-expiring paid entitlement,
    then the wallet permitted by the per_call route. No cross-source splitting.
    A purchase copies the plan version and debits cash once; calls consume units.
    No automatic renewals. Dates are UTC; date-valued response timestamps are
    represented at midnight UTC, unit transaction dates use YYYY-MM-DD.
    Reconciliation commits batches, resumes the original command and records
    every one-cent, one-record or one-unit discrepancy with an alert.
    Draft statements can be rebuilt; issued statements and their evidence are immutable.
    Later settlements, refunds and supplements enter a subsequent open month.
    Refunds are bounded by the original settlement. Unfunded supplements remain open.
security:
  - BearerAuth: []
paths:
  /api/v1/admin/pricing-plans:
    get:
      x-permission: billing:plan:list
      responses:
        '200': {$ref: '#/components/responses/Read'}
    post:
      x-permission: billing:plan:create
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/pricing-plans/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      x-permission: billing:plan:update
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/subscriptions:
    post:
      x-permission: billing:plan:grant
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Grant'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/entitlements:
    get:
      x-permission: billing:plan:list
      parameters:
        - {in: query, name: app_id, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Read'}
  /api/v1/admin/entitlements/{id}/txns:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      x-permission: billing:plan:list
      responses:
        '200': {$ref: '#/components/responses/Read'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-reconciliations:
    post:
      x-permission: billing:reconcile:run
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_date]
              additionalProperties: false
              properties:
                service_date: {type: string, format: date}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/reconcile-diffs:
    get:
      x-permission: billing:reconcile:list
      parameters: [{$ref: '#/components/parameters/Day'}]
      responses:
        '200': {$ref: '#/components/responses/Read'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/admin/reconcile-diffs/{id}/compensations:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      x-permission: billing:reconcile:list
      responses:
        '200': {$ref: '#/components/responses/Read'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      x-permission: billing:reconcile:resolve
      description: |
        Restore a missing call_charge only when the durable intent and the original
        cash or unit ledger prove it. Recheck every call rule, then append a credential
        and mark the cited observation resolved in the same transaction. Monetary
        inconsistencies remain open; original ledgers are never rewritten.
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-usage:
    get:
      x-permission: billing:reconcile:list
      parameters:
        - {in: query, name: service_date, required: true, schema: {type: string, format: date}}
      responses:
        '200': {$ref: '#/components/responses/Read'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-statements:
    get:
      x-permission: billing:statement:list
      parameters: [{$ref: '#/components/parameters/App'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/StatementList'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-statements/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      x-permission: billing:statement:list
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/StatementDetail'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-statements:generate:
    post:
      x-permission: billing:statement:generate
      description: Rebuild the draft from settled consumption and applied adjustments at a saved cutoff. An issued period returns 409.
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, month]
              properties:
                app_id: {type: string}
                month: {type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11'}
      responses:
        '201': {$ref: '#/components/responses/Statement'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-statements/{id}/issue:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      x-permission: billing:statement:issue
      description: Freeze a closed month's unchanged draft only with complete reconciliation coverage and no blocking open records. Version conflict is 10409; other state conflicts are 10004.
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201': {$ref: '#/components/responses/Statement'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-adjustments:
    get:
      x-permission: billing:statement:list
      parameters: [{$ref: '#/components/parameters/App'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/AdjustmentList'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      x-permission: billing:wallet:adjust
      description: Append a refund or supplement referencing the original cash settlement. Reason and an external evidence reference are required. A supplement requires an open difference; insufficient available funds return an open receipt without a debit or resolution.
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdjustmentInput'}
      responses:
        '201': {$ref: '#/components/responses/Adjustment'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing-adjustments/{id}/apply:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      x-permission: billing:wallet:adjust
      description: Retry an open funded adjustment. Its original evidence is retained; an applied receipt is returned without another debit.
      parameters: [{$ref: '#/components/parameters/Command'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '201': {$ref: '#/components/responses/Adjustment'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Command: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    ID: {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    Day: {in: query, name: service_date, schema: {type: string, format: date}}
    App: {in: query, name: app_id, schema: {type: string}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
    PageSize: {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    Statement:
      description: Draft or issued statement in the standard envelope
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/Statement'}}}
    StatementList:
      description: Owner-scoped statement page
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/StatementPage'}}}
    StatementDetail:
      description: Statement with a bounded page of evidence and next_cursor (zero at the end)
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/StatementDetail'}}}
    Adjustment:
      description: Open or applied financial adjustment in the standard envelope
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - {type: object, properties: {data: {$ref: '#/components/schemas/Adjustment'}}}
    AdjustmentList:
      description: Owner-scoped adjustment page
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/Page'}
                      - {type: object, properties: {list: {type: array, items: {$ref: '#/components/schemas/Adjustment'}}}}
    Read:
      description: Owner-scoped list in the standard response envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Created:
      description: Durable command receipt; a replay returns the original object
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Error:
      description: Safe business error; 401 and 403 also apply to every operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
  schemas:
    Page:
      type: object
      required: [list, total, page, page_size]
      properties:
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    StatementPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - {type: object, properties: {list: {type: array, items: {$ref: '#/components/schemas/Statement'}}}}
    Statement:
      type: object
      required: [id, app_id, currency, period_start, period_end, status, total_cents, total_units, cutoff_at, source_hash, version, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        app_id: {type: string}
        currency: {type: string, enum: [CNY]}
        period_start: {type: string, format: date-time, description: Inclusive UTC month start}
        period_end: {type: string, format: date-time, description: Exclusive UTC next month start}
        status: {type: string, enum: [draft, issued]}
        total_cents: {type: integer, format: int64, description: Exact signed sum of evidence amounts}
        total_units: {type: integer, format: int64, minimum: 0}
        cutoff_at: {type: string, format: date-time}
        source_hash: {type: string}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issued_at: {type: string, format: date-time}
        issued_by: {type: integer, format: int64}
    StatementDetail:
      allOf:
        - {$ref: '#/components/schemas/Statement'}
        - type: object
          required: [lines, next_cursor]
          properties:
            lines: {type: array, items: {$ref: '#/components/schemas/StatementLine'}}
            next_cursor: {type: integer, format: int64}
    StatementLine:
      type: object
      properties:
        id: {type: integer, format: int64}
        source_key: {type: string}
        kind: {type: string, enum: [call_cash, call_units, late_call_cash, late_call_units, subscription, late_subscription, refund, supplement]}
        amount_cents: {type: integer, format: int64}
        units: {type: integer, format: int64}
        price_cents: {type: integer, format: int64}
        quantity: {type: integer, format: int64}
        route_version: {type: integer}
        entitlement_id: {type: integer, format: int64}
        call_id: {type: string}
        original_txn_id: {type: integer, format: int64}
        original_statement_id: {type: integer, format: int64}
        service_date: {type: string, format: date-time}
        occurred_at: {type: string, format: date-time}
    AdjustmentInput:
      type: object
      additionalProperties: false
      required: [original_txn_id, kind, amount_cents, reason, evidence]
      properties:
        original_txn_id: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [refund, supplement]}
        amount_cents: {type: integer, format: int64, minimum: 1}
        diff_id: {type: integer, format: int64, minimum: 0, description: Required for supplement}
        reason: {type: string, minLength: 1, maxLength: 500}
        evidence: {type: string, minLength: 1, maxLength: 500, description: External case/reference ID; do not send secrets or request bodies}
    Adjustment:
      type: object
      properties:
        original_txn_id: {type: integer, format: int64}
        kind: {type: string, enum: [refund, supplement]}
        amount_cents: {type: integer, format: int64}
        diff_id: {type: integer, format: int64}
        reason: {type: string}
        evidence: {type: string}
        id: {type: integer, format: int64}
        app_id: {type: string}
        currency: {type: string, enum: [CNY]}
        actor_id: {type: integer, format: int64}
        status: {type: string, enum: [open, applied]}
        period_start: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        applied_at: {type: string, format: date-time}
        ledger_txn_id: {type: integer, format: int64}
    Envelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer}
        message: {type: string}
        trace_id: {type: string}
        request_id: {type: string}
        data: {}
    Plan:
      type: object
      required: [code, name, currency, price_cents, quota_type, unit_count, status]
      properties:
        id: {type: integer, format: int64, readOnly: true}
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 200}
        currency: {type: string, enum: [CNY]}
        price_cents: {type: integer, format: int64, minimum: 1}
        quota_type: {type: string, enum: [calls, units]}
        unit_count: {type: integer, format: int64, minimum: 1}
        valid_days: {type: integer, minimum: 0, maximum: 36500}
        route_id: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [active, disabled]}
        version: {type: integer, minimum: 1, description: Required on update}
    Grant:
      type: object
      required: [app_id]
      additionalProperties: false
      properties:
        app_id: {type: string}
        plan_id: {type: integer, format: int64, minimum: 1, description: Purchase this plan; omit for a gift}
        kind: {type: string, enum: [free, paid]}
        quota_type: {type: string, enum: [calls, units]}
        units: {type: integer, format: int64, minimum: 1}
        source_ref: {type: string, minLength: 1, maxLength: 200}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time, nullable: true}
        route_id: {type: integer, format: int64, minimum: 0}
        auto_renew: {type: boolean, enum: [false]}
