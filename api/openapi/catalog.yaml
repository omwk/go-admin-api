openapi: 3.0.3
info:
  title: Catalog API
  version: 0.M4a
paths:
  /api/v1/admin/exports:
    get:
      operationId: listProductExports
      x-permission: product:spu:export
      security: [{bearerAuth: []}]
      description: Current tenant and requester product exports only; ordered by created_at descending then id descending. Empty pages contain list []. Storage pointers, filters and signed download URLs are excluded.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: page_size, in: query, description: Values above 100 are clamped to 100., schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: sort, in: query, schema: {type: string, enum: [-created_at], default: -created_at}}
      responses:
        '200': {description: Owner-bound product export page, content: {application/json: {schema: {$ref: '#/components/schemas/ExportPageEnvelope'}}}}
        '400': {description: Invalid pagination or sort, content: {application/json: {schema: {$ref: '#/components/schemas/ExportError'}}}}
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ExportError'}}}}
        '403': {description: Missing route permission, content: {application/json: {schema: {$ref: '#/components/schemas/ExportError'}}}}
  /api/v1/admin/products/export:
    post:
      operationId: createProductExport
      x-permission: product:spu:export
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                filters:
                  type: object
                  description: Same product filters as the list API; pagination and cursor are not accepted.
                  properties:
                    category_id: {type: integer, format: int64, minimum: 1}
                    include_descendants: {type: boolean, default: false, description: Include all descendants of category_id; ignored when category_id is omitted.}
                sort: {type: string, enum: [updated_at, '-updated_at', title, '-title', price_cents, '-price_cents', price_min_cents, '-price_min_cents'], default: '-updated_at'}
      responses:
        '201':
          description: Frozen query snapshot with export_id and reserved running slot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportEnvelope'}
        '400':
          description: Invalid filters or client-supplied object key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportError'}
        '409':
          description: Idempotency key request mismatch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportError'}
        '429':
          description: '10005 export admission limit; details.limit identifies global_running, tenant_running, requester_running or tenant_pending'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportError'}
        '503':
          description: Authorization cache unavailable; no export is admitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportError'}
  /api/v1/admin/exports/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: readProductExport
      x-permission: product:spu:export
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Download URL lifetime min(1h, remaining object lifetime)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportEnvelope'}
        '404':
          description: Export absent or tenant/owner mismatch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportError'}
  /api/v1/admin/products:
    get:
      operationId: listProducts
      x-permission: product:spu:list
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: category_id, in: query, description: Internal SPU category or applied mapping of a bound listing, schema: {type: integer, format: int64, minimum: 1}}
        - {name: include_descendants, in: query, description: Include all descendants of category_id; ignored when category_id is omitted., schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Product page with signed deep-page continuation and tenant-owned category fields. Absent or deleted categories return null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPageEnvelope'}
        '400':
          description: Invalid filters; include_descendants must be true or false (10001).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductError'}
        '500':
          description: Unmapped internal failure (10002); private database details are logged with the same trace_id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductError'}
    post:
      operationId: createManualProduct
      x-permission: product:spu:create
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Created manual product}
        '409':
          description: Product conflict with a nonzero code and trace_id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductError'}
        '500':
          description: Unmapped internal failure (10002); no SQL, table names or constraint names are exposed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductError'}
  /api/v1/admin/products/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: readProduct
      x-permission: product:spu:read
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Safe product detail; data.reported_stock sums all bound listing_sku.stock and may double count physical inventory (可能重复计算).
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reported_stock: {type: integer, format: int64, description: Sum of platform reported SKU quantities; may double count (可能重复计算).}
                          product: {type: object}
                          skus: {type: array, items: {type: object}}
                          listings: {type: array, items: {type: object}}
                          media: {type: array, items: {type: object}}
    put:
      operationId: updateManualProduct
      x-permission: product:spu:update
      security: [{bearerAuth: []}]
      responses: {200: {description: Updated manual product}}
    delete:
      operationId: archiveProduct
      x-permission: product:spu:delete
      security: [{bearerAuth: []}]
      responses: {200: {description: Soft archived product}}
  /api/v1/admin/products/{id}/listings:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: listProductListings
      x-permission: product:spu:read
      security: [{bearerAuth: []}]
      responses: {200: {description: Safe listings attached to product}}
  /api/v1/admin/products/{id}/merge:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: mergeListingsToProduct
      x-permission: product:spu:merge
      security: [{bearerAuth: []}]
      responses: {200: {description: Product with manually attached listings}}
  /api/v1/admin/listings:
    get:
      operationId: listPlatformListings
      x-permission: product:spu:list
      security: [{bearerAuth: []}]
      parameters:
        - {name: category_id, in: query, description: Bound SPU category or applied mapping of this listing, schema: {type: integer, format: int64, minimum: 1}}
        - {name: include_descendants, in: query, description: Include all descendants of category_id; ignored when category_id is omitted., schema: {type: boolean, default: false}}
      responses:
        '200': {description: Safe platform listing page}
        '400':
          description: Invalid filters; include_descendants must be true or false (10001).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductError'}
  /api/v1/admin/categories:
    get:
      operationId: listCategories
      x-permission: product:category:list
      security: [{bearerAuth: []}]
      responses: {200: {description: Tenant category tree}}
  /api/v1/admin/category-mappings:
    get:
      operationId: listCategoryMappings
      x-permission: product:category:list
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PlatformID'}
        - {name: matched, in: query, schema: {type: string, enum: ['false', 'true', all], default: 'false'}, description: Filter category_id null / non-null / all mappings.}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/MappingPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/category-mappings/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    put:
      operationId: setCategoryMapping
      x-permission: product:category:map
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}, description: Optional; same key and request replay the first result. Different request returns 409/10006.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_id]
              properties:
                category_id: {type: integer, format: int64, minimum: 1, description: Active internal category in the same tenant.}
      responses:
        '200':
          description: Manual mapping; source=manual and confidence=1.0. Rule candidates and later category synchronization preserve it.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, category_id, source]
                        properties:
                          id: {type: integer, format: int64}
                          category_id: {type: integer, format: int64}
                          source: {type: string, enum: [manual]}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Mapping absent in the tenant (40401).}
        '409': {description: Idempotency request mismatch (10006) or processing (10004).}
  /api/v1/admin/category-mappings:auto:
    post:
      operationId: autoMapCategories
      x-permission: product:category:map
      security: [{bearerAuth: []}]
      description: Runs rules on the unmatched pool and returns candidates only. Does not persist assignments or alter manual mappings. Exact path and name confidence=0.9; child under a mapped parent confidence=0.6.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                platform_id: {type: integer, format: int64, minimum: 0, description: Omitted or zero selects all platforms in the tenant.}
      responses:
        '200': {$ref: '#/components/responses/MappingPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/inventories:
    get:
      operationId: listInventorySnapshots
      x-permission: product:spu:read
      security: [{bearerAuth: []}]
      description: Observations in verified tenant and shop scope, ordered by synced_at DESC then id DESC. Successful SKU upserts append observations within the page transaction. Retention is 30 days with daily cleanup.
      parameters:
        - {name: shop_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: listing_sku_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Snapshot page; quantities are platform reports and can overlap across listings.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/Page'}
                          - type: object
                            properties:
                              list: {type: array, items: {$ref: '#/components/schemas/InventorySnapshot'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    PlatformID: {name: platform_id, in: query, schema: {type: integer, format: int64, minimum: 1}, description: Omit for all tenant platforms.}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}, description: Offset traversal must remain below 10000 rows.}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    Invalid: {description: Invalid parameters or JSON (10001).}
    Unauthenticated: {description: Authentication required or token rejected.}
    Forbidden: {description: Permission or data scope denied (20107/20108).}
    MappingPage:
      description: Paginated mappings with current non-applied rule candidates, ordered by platform category path, external ID, then mapping ID.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/Page'}
                      - type: object
                        properties:
                          list: {type: array, items: {$ref: '#/components/schemas/MappingPoolItem'}}
  schemas:
    ProductPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/Page'}
                - type: object
                  properties:
                    list: {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
                    next_cursor: {type: string, description: Signed continuation for deep pages; omitted when unavailable.}
    ProductSummary:
      type: object
      required: [id, title, category_id, category_name, main_image, price_min_cents, price_max_cents, sku_count, shop_names, status, source, updated_at]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        category_id: {type: integer, format: int64, nullable: true, description: Internal category in the product tenant; null if absent or deleted.}
        category_name: {type: string, nullable: true, description: Name from the same category JOIN; null if absent or deleted., example: 电脑外设}
        main_image: {type: string}
        price_min_cents: {type: integer, format: int64}
        price_max_cents: {type: integer, format: int64}
        sku_count: {type: integer}
        shop_names: {type: array, items: {type: string}}
        status: {type: string}
        source: {type: string}
        updated_at: {type: string, format: date-time}
    ProductError:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer, example: 10002}
        message: {type: string, example: 服务内部错误}
        data: {type: object, nullable: true, example: null, description: Present as null for unmapped internal failures; may be omitted for mapped errors.}
        details: {type: object, additionalProperties: true}
        trace_id: {type: string}
        request_id: {type: string}
    ExportPageEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
        trace_id: {type: string}
        data:
          type: object
          additionalProperties: false
          required: [list, total, page, page_size]
          properties:
            list: {type: array, items: {$ref: '#/components/schemas/ExportListItem'}}
            total: {type: integer, format: int64}
            page: {type: integer, minimum: 1}
            page_size: {type: integer, minimum: 1, maximum: 100}
    ExportListItem:
      type: object
      additionalProperties: false
      required: [export_id, status, attempt, row_total, row_count, created_at, started_at, finished_at, expires_at]
      properties:
        export_id: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [pending, running, succeeded, failed, expired]}
        attempt: {type: integer, minimum: 0}
        row_total: {type: integer, format: int64, minimum: 0}
        row_count: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
    ExportError:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer}
        message: {type: string}
        trace_id: {type: string}
    ExportEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [export_id, status, attempt, row_total, row_count, created_at]
              properties:
                export_id: {type: integer, format: int64, minimum: 1}
                status: {type: string, enum: [pending, running, succeeded, failed, expired]}
                attempt: {type: integer, minimum: 0}
                row_total: {type: integer, format: int64, minimum: 0}
                row_count: {type: integer, format: int64, minimum: 0}
                created_at: {type: string, format: date-time}
                started_at: {type: string, format: date-time, nullable: true}
                finished_at: {type: string, format: date-time, nullable: true}
                expires_at: {type: string, format: date-time, nullable: true}
                download_url: {type: string}
                download_expires_at: {type: string, format: date-time}
    Envelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: ok}
        data: {type: object}
        trace_id: {type: string}
        request_id: {type: string}
    Page:
      type: object
      required: [list, total, page, page_size]
      properties:
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    InventorySnapshot:
      type: object
      required: [id, tenant_id, shop_id, listing_sku_id, available, reserved, synced_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        shop_id: {type: integer, format: int64}
        listing_sku_id: {type: integer, format: int64}
        available: {type: integer, description: Platform reported SKU stock.}
        reserved: {type: integer, description: Mapped SKU ext.reserved; zero when the platform does not report reservations.}
        synced_at: {type: string, format: date-time, description: Current synchronization UTC time; never raw fetched_at.}
    MappingPoolItem:
      type: object
      required: [mapping, platform_category, candidates]
      properties:
        mapping:
          type: object
          required: [id, tenant_id, platform_id, platform_category_id, category_id, confidence, source, created_at, updated_at]
          properties:
            id: {type: integer, format: int64}
            tenant_id: {type: integer, format: int64}
            platform_id: {type: integer, format: int64}
            platform_category_id: {type: integer, format: int64}
            category_id: {type: integer, format: int64, nullable: true}
            confidence: {type: number}
            source: {type: string, enum: [default, rule, manual]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
        platform_category:
          type: object
          properties:
            id: {type: integer, format: int64}
            tenant_id: {type: integer, format: int64}
            platform_id: {type: integer, format: int64}
            external_id: {type: string}
            parent_external_id: {type: string}
            name: {type: string}
            path: {type: string}
            is_leaf: {type: boolean}
            synced_at: {type: string, format: date-time}
        candidates:
          type: array
          items:
            type: object
            required: [category_id, name, path, confidence]
            properties:
              category_id: {type: integer, format: int64}
              name: {type: string}
              path: {type: string}
              confidence: {type: number, enum: [0.9, 0.6]}
